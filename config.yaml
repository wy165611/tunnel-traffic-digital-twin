detector:
  model: visdrone_yolo11n
  confidence: 0.40
  input_size: 960
  tiled: false
  tile_size: 540
  tile_overlap: 0.25
  nms_iou: 0.45
  device: auto
  cpu_threads: 4
tracking:
  max_age: 30
  min_hits: 2
  iou_threshold: 0.2
speed:
  smoothing_frames: 10
  min_samples: 5
events:
  stop_speed: 3.0
  stop_seconds: 3.0
  hard_braking_acceleration: -4.0
  wrong_way_seconds: 1.0
  wrong_way_cosine: -0.6
  cooldown_seconds: 5.0
  speeding_enabled: true
  speeding_kmh: 80.0
  slow_speed_enabled: true
  slow_speed_kmh: 20.0
  lane_change_enabled: true
  lane_change_seconds: 1.0
  tailgating_enabled: true
  tailgating_headway_seconds: 2.0
  intrusion_enabled: true
  queue_speed_kmh: 10.0
video:
  detection_interval: 2
  display_max_side: 960
  jpeg_quality: 80
  default_video: backend/data/videos/demo.mp4
traffic:
  legal_direction: [0, 1]
  history_points: 100
  time_occupancy_enabled: true
preprocessing:
  low_light_enabled: false
  clahe_clip_limit: 2.0
  gamma: 1.5
alerts:
  webhook_enabled: false
  webhook_url: ''
  webhook_timeout_seconds: 2.0
